name: Build Arch Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver override (e.g. 0.1.13-nightly.20261127.1)"
        required: false
        type: string
      create_release:
        description: "Publish a GitHub Release with the Arch package and AppImage"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-arch-package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-appimage:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      pkgver: ${{ steps.version.outputs.pkgver }}

    steps:
      # actions/checkout runs `git submodule foreach` during auth cleanup even with
      # submodules disabled, which fails on orphaned gitlinks in upstream's .repos/.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Resolve build version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          base_version="$(jq -r '.version' apps/desktop/package.json)"
          if [[ -n "$INPUT_VERSION" ]]; then
            build_version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/v* ]]; then
            build_version="${GITHUB_REF_NAME#v}"
          else
            stamp="$(date -u +%Y%m%d)"
            build_version="${base_version}-nightly.${stamp}.${GITHUB_RUN_NUMBER}"
          fi
          # In Arch vercmp, attaching `nightly` directly (e.g. 0.1.13nightly20261127.5) sorts
          # strictly below a plain 0.1.13 release tag while still sorting monotonically on main.
          pkgver="${build_version//-nightly./nightly}"
          pkgver="${pkgver//-/_}"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "Building version $build_version (Arch pkgver=$pkgver)"

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Install Linux desktop build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick

      - name: Cache native Rust helpers
        id: rust_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor
            native/kde-snap-shot/target/x86_64-unknown-linux-gnu/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/x86_64-unknown-linux-gnu/release/t3-hyprland-snap-shot
          key: linux-native-x64-${{ hashFiles('.cargo/config.toml', 'native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**', 'native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.rust_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build resource monitor
        if: steps.rust_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.build_version }}"

      - name: Build JS bundle
        shell: bash
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
          NODE_OPTIONS: --max-old-space-size=6144
        run: vp run build:desktop:bundle

      - name: Cache electron-builder Linux tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron-builder/appimage@*/appimage-tools-runtime-*.tar.gz
            ~/.cache/electron-builder/fpm@*/fpm-*.7z
            ~/.cache/electron-builder/7zip@*/7zip-linux-*.tar.gz
          key: electron-builder-linux-tools-x64-${{ hashFiles('node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/linux.js', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/7zip.js') }}

      - name: Build Linux AppImage
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.rust_cache.outputs.cache-hit == 'true' }}
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ steps.version.outputs.build_version }}" \
            --skip-build \
            --verbose

      - name: Stage AppImage artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(release/*.AppImage)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage in release/, found ${#appimages[@]}" >&2
            ls -la release/ || true
            exit 1
          fi
          mkdir -p dist-arch
          cp "${appimages[0]}" dist-arch/T3-Code-x86_64.AppImage
          ls -lh dist-arch/T3-Code-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage-x64
          path: dist-arch/T3-Code-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  build-arch-package:
    name: Build Arch Linux Package
    needs: [build-appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Arch packaging tools
        shell: bash
        run: pacman -Syu --noconfirm --needed git namcap sudo

      - name: Checkout packaging files
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/LICENSE' '/packaging/aur/t3code-fork-bin/'
          git checkout --detach FETCH_HEAD

      - name: Download Linux AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-appimage-x64
          path: packaging/aur/t3code-fork-bin

      - name: Create unprivileged build user
        shell: bash
        run: |
          useradd --create-home builder
          install -Dm0440 /dev/stdin /etc/sudoers.d/builder <<'EOF'
          builder ALL=(root) NOPASSWD: /usr/bin/pacman
          EOF

      - name: Build .pkg.tar.zst with makepkg
        shell: bash
        env:
          PKGVER: ${{ needs.build-appimage.outputs.pkgver }}
          BUILD_VERSION: ${{ needs.build-appimage.outputs.build_version }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          build_dir="/tmp/t3code-pkgbuild"
          rm -rf "$build_dir"
          mkdir -p "$build_dir"
          cp -a packaging/aur/t3code-fork-bin/. "$build_dir/"
          cp LICENSE "$build_dir/LICENSE"
          cd "$build_dir"

          appimage_sha="$(sha256sum T3-Code-x86_64.AppImage | awk '{print $1}')"
          license_sha="$(sha256sum LICENSE | awk '{print $1}')"
          app_name="T3 Code"
          if [[ "$BUILD_VERSION" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            app_name="T3 Code (Nightly)"
          fi

          sed -Ei \
            -e "s|^pkgver=.*|pkgver=${PKGVER}|" \
            -e "s|^url=.*|url='${REPO_URL}'|" \
            -e "s|^Name=.*|Name=${app_name}|" \
            PKGBUILD

          awk -v app_sha="$appimage_sha" -v lic_sha="$license_sha" '
            /^sha256sums=\(/ {
              print "sha256sums=("
              print "  \x27" app_sha "\x27"
              print "  \x27" lic_sha "\x27"
              print ")"
              skip = 1
              next
            }
            skip && /^\)/ { skip = 0; next }
            !skip { print }
          ' PKGBUILD > PKGBUILD.tmp
          mv PKGBUILD.tmp PKGBUILD

          chown -R builder:builder "$build_dir"
          runuser -u builder -- namcap PKGBUILD || true
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          # Repackaging a prebuilt AppImage only extracts squashfs and copies files;
          # runtime depends are still recorded in .PKGINFO without installing GTK/Mesa here.
          runuser -u builder -- makepkg --nodeps --cleanbuild --clean --noconfirm

          pkg_file="$(runuser -u builder -- makepkg --packagelist)"
          runuser -u builder -- namcap "$pkg_file" || true

          mkdir -p "$GITHUB_WORKSPACE/arch-out"
          cp "$pkg_file" PKGBUILD .SRCINFO "$GITHUB_WORKSPACE/arch-out/"
          (cd "$GITHUB_WORKSPACE/arch-out" && sha256sum "$(basename "$pkg_file")" > SHA256SUMS.txt)
          ls -lh "$GITHUB_WORKSPACE/arch-out"

      - name: Upload Arch Package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package-x86_64
          path: arch-out/*
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs: [build-appimage, build-arch-package]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build-appimage.outputs.build_version) }}
          BUILD_VERSION: ${{ needs.build-appimage.outputs.build_version }}
        run: |
          set -euo pipefail
          files=(
            release-assets/arch-package-x86_64/*
            release-assets/linux-appimage-x64/T3-Code-x86_64.AppImage
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "T3 Code ${BUILD_VERSION}" \
              --notes "Automated Arch Linux package (\`t3code-fork-bin\`) and AppImage build for \`${BUILD_VERSION}\`. Install on Arch Linux with \`sudo pacman -U t3code-fork-bin-*.pkg.tar.zst\`." \
              --prerelease
          fi
